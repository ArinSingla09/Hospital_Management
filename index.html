const content=$('#content');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function heading(eyebrow,title,desc,action='',handler=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action?`<button class="btn-primary" data-action="${handler}">${action}</button>`:''}</div>`}
function avatar(x){return `<div class="avatar ${x.color}">${x.initials}</div>`}
function status(v){const c=v==='Admitted'?'purple':v==='Discharged'?'gray':v==='Confirmed'?'green':v==='Waiting'?'orange':v==='In progress'?'blue':'blue';return `<span class="status ${c}">${v}</span>`}
function stat(icon,label,value,change,detail,tone){return `<div class="stat-card"><div class="stat-top"><div class="stat-icon ${tone}">${icon}</div><button class="dots">•••</button></div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-bottom"><span class="change">${change}</span><small>${detail}</small></div></div>`}
function appointmentRow(a){return `<div class="appointment-row"><div class="time-col">${a.time}</div>${avatar(a)}<div class="appointment-person"><b>${a.name}</b><small>${a.type}</small></div><div class="appointment-doctor">${a.doctor}</div>${status(a.status)}</div>`}
function dashboard(){const bars=[38,52,44,65,48,76,57,82,61,72,55,91];return `${heading('THURSDAY, NOVEMBER 5, 2026','Good morning, Alex 👋','Here’s what’s happening at your hospital today.','▣ View schedule','Appointments')}<div class="stats-grid">${stat('♙','Total patients','2,846','↑ 12.8%','vs. last month','purple')}${stat('▣','Appointments','184','↑ 8.2%','vs. last month','blue')}${stat('▤','Available beds','42 / 120','35%','occupancy available','green')}${stat('＄','Total revenue','$48,290','↑ 16.4%','vs. last month','orange')}</div><div class="dashboard-grid"><section class="panel revenue-panel"><div class="panel-head"><div><h3>Hospital overview</h3><p>Patient admissions and activity</p></div><select class="select-small"><option>Last 12 months</option><option>Last 30 days</option></select></div><div class="chart-legend"><span><i class="legend-dot"></i> Admissions</span><span><i class="legend-dot pale"></i> Discharges</span></div><div class="bar-chart">${bars.map((v,i)=>`<div class="bar-group"><div class="bar-pair"><div class="bar pale" style="height:${v*.68}%"></div><div class="bar dark" style="height:${v}%"></div></div><small>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]}</small></div>`).join('')}</div><div class="chart-footer"><span>Admissions are up <b>12.8%</b> compared to last year</span><a data-page="Patients">View report ↗</a></div></section><section class="panel"><div class="panel-head"><div><h3>Department capacity</h3><p>Current bed occupancy</p></div><button class="dots">•••</button></div><div class="capacity-total"><strong>78%</strong><span>Overall occupancy</span></div>${[['Cardiology',86,'#8065d8'],['Neurology',72,'#4e9cda'],['Orthopedics',64,'#42b99a'],['Pediatrics',48,'#efa96b']].map(d=>`<div class="capacity-row"><div><span>${d[0]}</span><b>${d[1]}%</b></div><div class="progress-track"><i style="width:${d[1]}%;background:${d[2]}"></i></div></div>`).join('')}<a class="panel-link" data-page="Departments">View all departments ↗</a></section></div><div class="lower-grid"><section class="panel"><div class="panel-head"><div><h3>Upcoming appointments</h3><p>You have 8 appointments scheduled today</p></div><a data-page="Appointments">See all ↗</a></div><div class="appointment-list">${appointments.slice(0,4).map(appointmentRow).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>On-duty doctors</h3><p>Medical team availability</p></div><a data-page="Doctors">View all ↗</a></div>${doctors.slice(0,3).map(d=>`<div class="doctor-mini">${avatar(d)}<div class="doctor-info"><b>${d.name}</b><small>${d.spec}</small></div>${status(d.status==='Available'?'Confirmed':d.status)}</div>`).join('')}</section></div>`}
function patientsPage(){const list=patients.filter(p=>(p.name+p.id+p.email).toLowerCase().includes(patientQuery.toLowerCase()));return `${heading('PATIENT MANAGEMENT','Patients','Manage patient records, admissions, and medical histories.','＋ Add patient','addPatient')}<div class="summary-strip"><div>♙ <span><b>2,846</b><small>Total patients</small></span></div><div>✚ <span><b>128</b><small>Admitted today</small></span></div><div>✓ <span><b>96</b><small>Discharged this week</small></span></div></div><section class="panel table-panel"><div class="table-toolbar"><div><h3>All patients <span class="count-pill">${list.length}</span></h3><p>A list of all patients registered at your hospital.</p></div><div class="table-actions"><div class="table-search">⌕ <input id="patientSearch" placeholder="Search patients..." value="${patientQuery.replaceAll('"','&quot;')}"></div><button class="btn-secondary" data-action="clearSearch">Filter</button><button class="btn-secondary" data-action="exportPatients">⇩ Export</button></div></div><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Patient ID</th><th>Age / Gender</th><th>Assigned doctor</th><th>Last visit</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="table-person">${avatar(p)}<div><b>${p.name}</b><small>${p.email}</small></div></div></td><td>${p.id}</td><td>${p.age} yrs · ${p.gender}</td><td>${p.doctor}</td><td>${p.date}</td><td>${status(p.status)}</td><td><button class="dots">•••</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty-state">No patients found. Try another search.</div>'}</div><div class="table-foot"><span>Showing <b>${list.length}</b> of 2,846 patients</span><div><button class="btn-secondary">Previous</button><button class="btn-secondary">Next</button></div></div></section>`}
function appointmentsPage(){return `${heading('SCHEDULE & BOOKINGS','Appointments','Keep track of consultations and manage your daily schedule.','＋ New appointment','newAppointment')}<div class="appointment-summary">${[['Today’s appointments','24','↑ 8.2% from yesterday'],['Completed','12','50% of today’s schedule'],['Waiting','06','Across all departments'],['Cancelled','02','Today']].map(x=>`<div class="summary-box"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><section class="panel table-panel"><div class="panel-head appointment-title"><div><h3>Thursday, November 5</h3><p>Appointments scheduled for today</p></div><button class="btn-secondary">▣ Today</button></div><div class="appointment-list full">${appointments.map(appointmentRow).join('')}</div></section>`}
function doctorsPage(){return `${heading('MEDICAL TEAM','Doctors','Manage your medical professionals, availability, and schedules.','＋ Add doctor','addDoctor')}<div class="doctor-grid">${doctors.map(d=>`<div class="panel doctor-card"><div class="doctor-card-top">${avatar(d)}<button class="dots">•••</button></div><h3>${d.name}</h3><p>${d.spec}</p><div class="doctor-meta"><span>♙ &nbsp;${d.patients} patients</span><span>◷ &nbsp;${d.shift}</span></div><div class="doctor-card-foot">${status(d.status==='Available'?'Confirmed':d.status)}<button class="text-button" data-action="doctorProfile">View profile ↗</button></div></div>`).join('')}</div>`}
function departmentsPage(){const deps=[['Cardiology','Heart & cardiovascular care','12 doctors',86,'purple'],['Neurology','Brain and nervous system','8 doctors',72,'blue'],['Orthopedics','Bones, joints and muscles','10 doctors',64,'green'],['Pediatrics','Care for infants and children','7 doctors',48,'orange'],['Dermatology','Skin, hair and nail care','5 doctors',38,'pink'],['Emergency','24/7 emergency services','14 doctors',92,'red']];return `${heading('HOSPITAL FACILITIES','Departments','An overview of departments, teams, and bed capacity.','＋ Add department','addDepartment')}<div class="department-grid">${deps.map(d=>`<div class="panel department-card"><div class="department-symbol ${d[4]}">▤</div><div class="department-card-title"><h3>${d[0]}</h3><button class="dots">•••</button></div><p>${d[1]}</p><div class="department-meta"><span>${d[2]}</span><span>${d[3]}% occupied</span></div><div class="progress-track"><i style="width:${d[3]}%;background:#8065d8"></i></div></div>`).join('')}</div>`}
function billingPage(){const rows=[['INV-2084','Olivia Rhye','Nov 05, 2026','$480.00','Paid'],['INV-2083','Phoenix Baker','Nov 05, 2026','$120.00','Pending'],['INV-2082','Lana Steiner','Nov 04, 2026','$860.00','Paid'],['INV-2081','Demi Wilkinson','Nov 04, 2026','$240.00','Overdue'],['INV-2080','Candice Wu','Nov 03, 2026','$320.00','Paid']];return `${heading('FINANCE & PAYMENTS','Billing','Track invoices, payments, and outstanding balances.','＋ Create invoice','createInvoice')}<div class="stats-grid billing-stats">${stat('＄','Total revenue','$48,290','↑ 16.4%','vs. last month','green')}${stat('▤','Total invoices','1,284','↑ 6.8%','vs. last month','blue')}${stat('◷','Pending payments','$6,420','12 invoices','Awaiting payment','orange')}${stat('↘','Overdue amount','$1,840','4 invoices','Needs attention','purple')}</div><section class="panel table-panel"><div class="table-toolbar"><div><h3>Recent invoices</h3><p>Review the latest patient billing activity.</p></div><button class="btn-secondary" data-action="exportInvoices">⇩ Export</button></div><div class="table-wrap"><table><thead><tr><th>Invoice ID</th><th>Patient</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td><b>${r[3]}</b></td><td>${status(r[4]==='Paid'?'Confirmed':r[4]==='Pending'?'Waiting':'Admitted')}</td><td><button class="dots">•••</button></td></tr>`).join('')}</tbody></table></div></section>`}
function settingsPage(){return `${heading('PREFERENCES','Settings','Manage your hospital profile and application preferences.')}<div class="settings-layout"><div class="panel settings-nav"><b>General</b><span class="selected">Hospital profile</span><span>Notifications</span><span>Security</span><span>Team & permissions</span></div><section class="panel settings-panel"><h3>Hospital profile</h3><p>Update your hospital’s public information.</p><form class="settings-form" id="settingsForm"><label>Hospital name<input value="St. Mary’s Hospital"></label><label>Contact email<input value="contact@stmaryshospital.com"></label><label>Phone number<input value="+1 (415) 555-0100"></label><label>Hospital address<input value="2450 Market Street, San Francisco, CA"></label><label>Timezone<select><option>Pacific Time (PT)</option><option>India Standard Time (IST)</option><option>Eastern Time (ET)</option></select></label></form><div class="settings-save"><button class="btn-primary" data-action="saveSettings">Save changes</button></div></section></div>`}
function render(page=currentPage){currentPage=page;$('#crumb').textContent=page;document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const pages={Overview:dashboard,Patients:patientsPage,Appointments:appointmentsPage,Doctors:doctorsPage,Departments:departmentsPage,Billing:billingPage,Settings:settingsPage};content.innerHTML=(pages[page]||dashboard)();$('#sidebar').classList.remove('open');}
function openPatientModal(){$('#patientModal').classList.add('show')}
function exportCsv(filename,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){render(nav.dataset.page);return}const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;switch(act){case'addPatient':openPatientModal();break;case'newAppointment':case'addDoctor':case'addDepartment':case'createInvoice':toast('This form can be connected to your backend next.');break;case'doctorProfile':toast('Doctor profile preview');break;case'saveSettings':toast('Settings saved successfully');break;case'clearSearch':patientQuery='';render('Patients');break;case'exportPatients':exportCsv('patients.csv',[['Patient ID','Name','Email','Phone','Age','Gender','Status'],...patients.map(p=>[p.id,p.name,p.email,p.phone,p.age,p.gender,p.status])]);toast('Patient list exported');break;case'exportInvoices':toast('Invoice export is ready to connect');break}});
$('#navigation').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)render(b.dataset.page)});
content.addEventListener('input',e=>{if(e.target.id==='patientSearch'){const pos=e.target.selectionStart;patientQuery=e.target.value;render('Patients');const input=$('#patientSearch');input.focus();input.setSelectionRange(pos,pos)}});
$('#patientForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const initials=d.name.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();patients.unshift({id:'PT-'+(2049+patients.length),name:d.name,email:d.email,phone:d.phone,gender:d.gender,age:d.age,status:'Outpatient',doctor:'Not assigned',date:'Nov 05, 2026',initials,color:'mint'});e.target.reset();$('#patientModal').classList.remove('show');patientQuery='';render('Patients');toast('Patient added successfully')});
$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#patientModal').classList.remove('show');
$('#patientModal').addEventListener('click',e=>{if(e.target.id==='patientModal')e.currentTarget.classList.remove('show')});
$('#menuBtn').onclick=()=>$('#sidebar').classList.add('open');$('#closeMenu').onclick=()=>$('#sidebar').classList.remove('open');
$('#notifications').onclick=()=>toast('You’re all caught up!');$('#helpBtn').onclick=()=>toast('Help center opened in demo mode');
$('#globalSearch').addEventListener('input',e=>{if(currentPage!=='Patients')render('Patients');patientQuery=e.target.value;render('Patients');const p=$('#patientSearch');if(p){p.value=patientQuery;p.focus()}});
render();
</script>
</body></html>
