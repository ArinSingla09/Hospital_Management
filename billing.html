
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicare | Billing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
body{background:#f4f5fb;color:#292747}
header{background:#302b65;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;background:#514a91;padding:9px 15px;border-radius:8px}
main{max-width:1150px;margin:35px auto;padding:0 20px}
.heading{margin-bottom:22px}h1{font-size:27px}.muted{color:#85849a;font-size:14px;margin-top:5px}
.panel{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 22px #28245c0c;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}
.stat{background:white;padding:20px;border-radius:12px}.stat strong{display:block;font-size:25px;color:#6558c7;margin-top:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;color:#666;display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #dedee9;border-radius:8px;outline:none;background:white}
input:focus,select:focus{border-color:#6558c7}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:600}
.primary{background:#6558c7;color:white}.success{background:#e4f7ed;color:#16834b}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:200px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #eee;font-size:14px}
th{color:#77758b;background:#fafaff}
.paid{background:#e4f7ed;color:#16834b;padding:6px 9px;border-radius:20px;font-size:12px}
.pending{background:#fff0df;color:#a75d12;padding:6px 9px;border-radius:20px;font-size:12px}
.full{grid-column:1/-1}.total-line{display:flex;justify-content:space-between;padding:8px 0;color:#666}
.total-line.grand{font-size:19px;font-weight:bold;color:#302b65;border-top:1px solid #eee;margin-top:8px;padding-top:15px}
#message{margin-top:12px;color:#16834b;font-size:14px}
@media(max-width:650px){.stats{grid-template-columns:1fr}form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h2>✚ Medicare Hospital</h2><a href="index.html">← Dashboard</a></header>
<main>
<div class="heading"><h1>Billing & Payments</h1><p class="muted">Create patient invoices and track payments.</p></div>
<div class="stats">
<div class="stat">Total Revenue<strong id="revenue">₹ 8,500</strong></div>
<div class="stat">Bills Generated<strong id="billCount">3</strong></div>
<div class="stat">Pending Amount<strong id="pendingTotal">₹ 2,000</strong></div>
</div>

<section class="panel">
<h3 style="margin-bottom:18px">Generate New Bill</h3>
<form id="billForm">
<div><label>Patient Name</label><input id="patient" placeholder="Enter patient name" required></div>
<div><label>Patient ID</label><input id="patientId" placeholder="e.g. P1001" required></div>
<div><label>Consultation Fee (₹)</label><input id="consultation" type="number" min="0" value="500" required></div>
<div><label>Lab Charges (₹)</label><input id="lab" type="number" min="0" value="0" required></div>
<div><label>Medicine Charges (₹)</label><input id="medicine" type="number" min="0" value="0" required></div>
<div><label>Other Charges (₹)</label><input id="other" type="number" min="0" value="0" required></div>
<div><label>Payment Method</label><select id="method"><option>Cash</option><option>UPI</option><option>Credit Card</option><option>Debit Card</option><option>Insurance</option></select></div>
<div><label>Payment Status</label><select id="paymentStatus"><option>Paid</option><option>Pending</option></select></div>
<div class="full">
<div class="total-line"><span>Subtotal</span><b id="subtotal">₹ 500</b></div>
<div class="total-line"><span>GST (5%)</span><b id="gst">₹ 25</b></div>
<div class="total-line grand"><span>Grand Total</span><b id="grandTotal">₹ 525</b></div>
</div>
<div class="full"><button class="primary" type="submit">+ Generate Bill</button></div>
</form>
<p id="message"></p>
</section>

<section class="panel">
<div class="toolbar">
<input id="search" placeholder="Search by bill ID, patient or patient ID..." oninput="render()">
<select id="filter" onchange="render()"><option value="">All payments</option><option>Paid</option><option>Pending</option></select>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Bill ID</th><th>Patient</th><th>Patient ID</th><th>Date</th><th>Amount</th><th>Method</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="billRows"></tbody>
</table>
</div>
</section>
</main>
<script>
let bills=[
{id:"B3001",patient:"Rahul Sharma",patientId:"P1001",date:"2026-11-03",amount:2500,method:"UPI",status:"Paid"},
{id:"B3002",patient:"Priya Mehta",patientId:"P1002",date:"2026-11-04",amount:4000,method:"Cash",status:"Paid"},
{id:"B3003",patient:"Aarav Patel",patientId:"P1003",date:"2026-11-05",amount:2000,method:"Insurance",status:"Pending"}
];
let nextId=3004;
const $=id=>document.getElementById(id);
const money=n=>"₹ "+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
function calculate(){
let subtotal=["consultation","lab","medicine","other"].reduce((s,id)=>s+Math.max(0,Number($(id).value)||0),0);
let gst=subtotal*.05,total=subtotal+gst;
$("subtotal").textContent=money(subtotal);
$("gst").textContent=money(gst);
$("grandTotal").textContent=money(total);
return total;
}
["consultation","lab","medicine","other"].forEach(id=>$(id).addEventListener("input",calculate));
function render(){
let q=$("search").value.toLowerCase(),f=$("filter").value;
let list=bills.filter(b=>(b.id+" "+b.patient+" "+b.patientId).toLowerCase().includes(q)&&(!f||b.status===f));
$("billRows").innerHTML=list.map(b=>`
<tr><td><b>${b.id}</b></td><td>${b.patient}</td><td>${b.patientId}</td><td>${b.date}</td>
<td>${money(b.amount)}</td><td>${b.method}</td>
<td><span class="${b.status==="Paid"?"paid":"pending"}">${b.status}</span></td>
<td>${b.status==="Pending"?`<button class="success" onclick="markPaid('${b.id}')">Mark Paid</button>`:"—"}</td></tr>
`).join("")||'<tr><td colspan="8">No bills found.</td></tr>';
let paid=bills.filter(b=>b.status==="Paid").reduce((s,b)=>s+b.amount,0);
let pending=bills.filter(b=>b.status==="Pending").reduce((s,b)=>s+b.amount,0);
$("revenue").textContent=money(paid);
$("pendingTotal").textContent=money(pending);
$("billCount").textContent=bills.length;
}
function markPaid(id){
let bill=bills.find(b=>b.id===id);
if(bill){bill.status="Paid";render();}
}
$("billForm").addEventListener("submit",e=>{
e.preventDefault();
let amount=calculate();
let bill={id:"B"+nextId++,patient:$("patient").value.trim(),patientId:$("patientId").value.trim(),date:new Date().toISOString().split("T")[0],amount,method:$("method").value,status:$("paymentStatus").value};
bills.push(bill);
e.target.reset();
$("consultation").value=500;
$("lab").value=0;$("medicine").value=0;$("other").value=0;
calculate();
$("message").textContent="Bill "+bill.id+" generated successfully. Total: "+money(amount);
render();
});
calculate();render();
</script>
</body>
</html>
