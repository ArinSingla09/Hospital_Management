
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicare | Departments</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
body{background:#f4f5fb;color:#292747}
header{background:#302b65;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:white;text-decoration:none;background:#514a91;padding:9px 15px;border-radius:8px}
main{max-width:1150px;margin:35px auto;padding:0 20px}
.heading{margin-bottom:22px}h1{font-size:27px}.muted{color:#85849a;font-size:14px;margin-top:5px}
.panel{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 22px #28245c0c;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat{background:white;padding:20px;border-radius:12px}
.stat strong{display:block;font-size:25px;color:#6558c7;margin-top:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:13px;color:#666;display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #dedee9;border-radius:8px;outline:none;background:white}
input:focus,select:focus{border-color:#6558c7}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:600}
.primary{background:#6558c7;color:white}
.danger{background:#ffe9e9;color:#c03939}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.dept-card{border:1px solid #eee;border-radius:12px;padding:20px}
.dept-icon{width:48px;height:48px;display:grid;place-items:center;background:#e9e7ff;border-radius:12px;font-size:24px;margin-bottom:14px}
.dept-card h3{margin-bottom:5px;font-size:17px}
.head{font-size:13px;color:#6558c7;font-weight:600}
.info{font-size:13px;color:#777;line-height:1.9;margin-top:13px}
.bedbar{height:8px;background:#eee;border-radius:10px;margin-top:8px;overflow:hidden}
.bedbar span{display:block;height:100%;background:#6558c7;border-radius:10px}
.full{grid-column:1/-1}
#message{color:#16834b;font-size:14px;margin-top:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.grid,.stats,form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<h2>✚ Medicare Hospital</h2>
<a href="index.html">← Dashboard</a>
</header>

<main>
<div class="heading">
<h1>Department Management</h1>
<p class="muted">Manage hospital departments, doctors and bed capacity.</p>
</div>

<div class="stats">
<div class="stat">Total Departments<strong id="total">6</strong></div>
<div class="stat">Total Doctors<strong id="doctors">42</strong></div>
<div class="stat">Total Beds<strong id="beds">180</strong></div>
<div class="stat">Occupied Beds<strong id="occupied">112</strong></div>
</div>

<section class="panel">
<h3 style="margin-bottom:18px">Add New Department</h3>
<form id="deptForm">
<div><label>Department Name</label><input id="name" placeholder="e.g. Cardiology" required></div>
<div><label>Department Head</label><input id="head" placeholder="Doctor name" required></div>
<div><label>Number of Doctors</label><input id="doctorCount" type="number" min="0" value="1" required></div>
<div><label>Total Beds</label><input id="totalBeds" type="number" min="0" value="10" required></div>
<div><label>Occupied Beds</label><input id="occupiedBeds" type="number" min="0" value="0" required></div>
<div><label>Contact Number</label><input id="phone" type="tel" placeholder="Contact number"></div>
<div class="full"><button class="primary" type="submit">+ Add Department</button></div>
</form>
<p id="message"></p>
</section>

<section class="panel">
<div class="toolbar">
<input id="search" placeholder="Search department or department head..." oninput="render()">
</div>
<div class="grid" id="departmentGrid"></div>
</section>
</main>

<script>
let departments=[
{id:"DEP101",name:"Cardiology",head:"Dr. Ananya Rao",doctors:8,beds:30,occupied:22,phone:"9876500001",icon:"❤️"},
{id:"DEP102",name:"Neurology",head:"Dr. Rohan Mehta",doctors:6,beds:25,occupied:18,phone:"9876500002",icon:"🧠"},
{id:"DEP103",name:"Orthopedics",head:"Dr. Neha Kapoor",doctors:7,beds:35,occupied:24,phone:"9876500003",icon:"🦴"},
{id:"DEP104",name:"Dermatology",head:"Dr. Vikram Shah",doctors:5,beds:20,occupied:10,phone:"9876500004",icon:"🩺"},
{id:"DEP105",name:"Pediatrics",head:"Dr. Isha Nair",doctors:9,beds:40,occupied:26,phone:"9876500005",icon:"👶"},
{id:"DEP106",name:"General Medicine",head:"Dr. Karan Desai",doctors:7,beds:30,occupied:12,phone:"9876500006",icon:"🏥"}
];
let nextId=107;
const $=id=>document.getElementById(id);

function render(){
let q=$("search").value.toLowerCase();
let list=departments.filter(d=>(d.name+" "+d.head).toLowerCase().includes(q));

$("departmentGrid").innerHTML=list.map(d=>`
<div class="dept-card">
<div class="dept-icon">${d.icon}</div>
<h3>${d.name}</h3>
<p class="head">${d.head}</p>
<div class="info">
Department ID: ${d.id}<br>
Doctors: ${d.doctors}<br>
Beds: ${d.occupied} occupied / ${d.beds} total<br>
Contact: ${d.phone||"Not provided"}
</div>
<div class="bedbar"><span style="width:${d.beds?Math.min(100,d.occupied/d.beds*100):0}%"></span></div>
<p class="muted">${d.beds?Math.round(d.occupied/d.beds*100):0}% bed occupancy</p>
<button class="danger" style="margin-top:14px" onclick="removeDept('${d.id}')">Delete Department</button>
</div>`).join("")||"<p>No departments found.</p>";

$("total").textContent=departments.length;
$("doctors").textContent=departments.reduce((s,d)=>s+d.doctors,0);
$("beds").textContent=departments.reduce((s,d)=>s+d.beds,0);
$("occupied").textContent=departments.reduce((s,d)=>s+d.occupied,0);
}

function removeDept(id){
if(confirm("Delete this department?")){
departments=departments.filter(d=>d.id!==id);
render();
}
}

$("deptForm").addEventListener("submit",e=>{
e.preventDefault();
let total=Number($("totalBeds").value);
let occupied=Number($("occupiedBeds").value);
if(occupied>total){$("message").textContent="Occupied beds cannot exceed total beds.";return;}
let name=$("name").value.trim();
if(departments.some(d=>d.name.toLowerCase()===name.toLowerCase())){
$("message").textContent="This department already exists.";return;
}
departments.push({
id:"DEP"+nextId++,name,head:$("head").value.trim(),
doctors:Number($("doctorCount").value),beds:total,occupied,
phone:$("phone").value.trim(),icon:"🏥"
});
e.target.reset();
$("message").textContent="Department added successfully.";
render();
});
render();
</script>
</body>
</html>
